name: Dottie
options:
  bundleIdPrefix: tech.phin
  deploymentTarget:
    macOS: "14.0"
packages:
  Dottie:
    path: .
targets:
  Dottie:
    type: application
    platform: macOS
    sources: [App]
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    dependencies:
      - package: Dottie
        product: DottieKit
      - target: DottieCLI
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.phin.dottie
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dottie
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: Dottie Drawing
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [tech.phin.dottie]
          - CFBundleTypeName: Dottie Stencil Library
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [tech.phin.dottielib]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: tech.phin.dottie
            UTTypeDescription: Dottie Drawing
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [dottie]
          - UTTypeIdentifier: tech.phin.dottielib
            UTTypeDescription: Dottie Stencil Library
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [dottielib]
  # The `dottie` command, embedded in the app at Contents/Helpers and linked onto the PATH from Settings.
  DottieCLI:
    type: tool
    platform: macOS
    sources: [Sources/DottieCLI]
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    dependencies:
      - package: Dottie
        product: DottieKit
    settings:
      base:
        # Not `dottie`: that differs from the app's `Dottie` executable only by case.
        PRODUCT_NAME: dottie-cli
        SWIFT_VERSION: "6.0"
  # Drives the real CanvasNSView with synthesized mouse events. Unhosted on purpose: launching the app
  # as a test host would take over the live socket of a running Dottie.
  CanvasTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - CanvasTests
      - App/CanvasView.swift
      - App/Preferences.swift
      - App/MCPSettings.swift
      - App/CommandLineSettings.swift
      - App/ScriptingSettings.swift
      - App/OptionalLibraries.swift
      - App/LiveServer.swift
      - App/DrawingDocument.swift
    dependencies:
      - package: Dottie
        product: DottieKit
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_BUNDLE_IDENTIFIER: tech.phin.dottie.canvastests
