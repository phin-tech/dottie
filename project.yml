name: Dottie
options:
  bundleIdPrefix: tech.phin
  # Matches the Xcode in use, so it does not offer to "update to recommended settings" on every regenerate.
  xcodeVersion: "26.6"
  deploymentTarget:
    macOS: "14.0"
packages:
  Dottie:
    path: .
  # Same pin as Package.swift, for the bundled dottie-mcp target.
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    revision: a0ae212ebf6eab5f754c3129608bc5557637e605
targets:
  Dottie:
    type: application
    platform: macOS
    sources: [App]
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    dependencies:
      - package: Dottie
        product: DottieKit
      - target: DottieCLI
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: DottieMCP
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.phin.dottie
        # The release version (`just release` tags v<this>); bump both for each release.
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dottie
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        ENABLE_HARDENED_RUNTIME: YES
        DEAD_CODE_STRIPPING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: App/Dottie.entitlements
      properties:
        # JavaScriptCore JIT for the scripting console and run_script; without it scripts run interpreted.
        com.apple.security.cs.allow-jit: true
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDocumentTypes:
          - CFBundleTypeName: Dottie Drawing
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [tech.phin.dottie]
          - CFBundleTypeName: Dottie Stencil Library
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [tech.phin.dottielib]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: tech.phin.dottie
            UTTypeDescription: Dottie Drawing
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [dottie]
          - UTTypeIdentifier: tech.phin.dottielib
            UTTypeDescription: Dottie Stencil Library
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [dottielib]
  # The `dottie` command, embedded in the app at Contents/Helpers and linked onto the PATH from Settings.
  DottieCLI:
    type: tool
    platform: macOS
    sources: [Sources/DottieCLI]
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    dependencies:
      - package: Dottie
        product: DottieKit
    settings:
      base:
        # Not `dottie`: that differs from the app's `Dottie` executable only by case.
        PRODUCT_NAME: dottie-cli
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: YES
        DEAD_CODE_STRIPPING: YES
        # Ships inside the app only; installing it on its own makes an archive a generic one Xcode cannot
        # distribute as an app.
        SKIP_INSTALL: YES
  # The MCP server, embedded in the app at Contents/Helpers; Settings ▸ MCP shows how to connect a client to it.
  DottieMCP:
    type: tool
    platform: macOS
    sources: [Sources/DottieMCP]
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    dependencies:
      - package: Dottie
        product: DottieKit
      - package: MCP
        product: MCP
    settings:
      base:
        PRODUCT_NAME: dottie-mcp
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: YES
        DEAD_CODE_STRIPPING: YES
        SKIP_INSTALL: YES
  # Drives the real CanvasNSView with synthesized mouse events. Unhosted on purpose: launching the app
  # as a test host would take over the live socket of a running Dottie.
  CanvasTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - CanvasTests
      - App/CanvasView.swift
      - App/Preferences.swift
      - App/MCPSettings.swift
      - App/CommandLineSettings.swift
      - App/ScriptingSettings.swift
      - App/OptionalLibraries.swift
      - App/LiveServer.swift
      - App/DrawingDocument.swift
      - App/UpdateChecker.swift
    dependencies:
      - package: Dottie
        product: DottieKit
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_BUNDLE_IDENTIFIER: tech.phin.dottie.canvastests
