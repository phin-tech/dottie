# Publishes website/ (Material for MkDocs) to GitHub Pages. The demo drawings are made on a Mac by `just demos`
# and committed (website/docs/drawings); the site plays them with <dottie-player>, built here from web/.
name: Pages

on:
  push:
    branches: [main]
    paths: [website/**, web/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build dottie.js
        working-directory: web
        run: |
          npm ci
          npm run build
          cp dist/dottie-player.min.js ../website/docs/assets/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r website/requirements.txt
      - run: mkdocs build --strict -f website/mkdocs.yml -d ../_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
