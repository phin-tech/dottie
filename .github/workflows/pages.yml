# Publishes website/ (Material for MkDocs) to GitHub Pages. The demo players are made on
# a Mac by `just demos` and committed (website/docs/players), since rendering them needs Dottie itself.
name: Pages

on:
  push:
    branches: [main]
    paths: [website/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r website/requirements.txt
      - run: mkdocs build --strict -f website/mkdocs.yml -d ../_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
