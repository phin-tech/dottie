site_name: Dottie
site_description: Hand-drawn diagrams on your Mac, that your AI assistant can draw and animate for you.
site_url: https://phin-tech.github.io/dottie/
repo_url: https://github.com/phin-tech/dottie
repo_name: phin-tech/dottie
edit_uri: ""
copyright: Dottie is open source under the MIT license.

theme:
  name: material
  logo: assets/icon.png
  favicon: assets/icon.png
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: amber
      accent: deep orange
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      accent: deep orange
      toggle: { icon: material/weather-sunny, name: Light mode }

nav:
  - Home: index.md
  - Animation demos: demos.md

extra_css:
  - assets/site.css

# Built from web/ by the Pages workflow (or `just site` locally); not committed.
extra_javascript:
  - assets/dottie-player.min.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
